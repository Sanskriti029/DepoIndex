<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DepoIndex — Deposition Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        /* ---------- HEADER ---------- */

        header {
            background: linear-gradient(135deg, #111827, #1e3a5f);
            color: white;
            padding: 42px 20px;
            text-align: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            border-radius: 10px;
            font-size: 22px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 10px 0 0;
            color: #cbd5e1;
            font-size: 16px;
        }

        /* ---------- MAIN ---------- */

        .container {
            max-width: 1050px;
            margin: 35px auto;
            padding: 0 20px;
        }

        /* ---------- SEARCH ---------- */

        .search-section {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.07);
            border: 1px solid #e5e7eb;
        }

        .search-title {
            margin: 0 0 5px;
            font-size: 19px;
        }

        .search-subtitle {
            margin: 0 0 18px;
            color: #64748b;
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        #query {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            transition: 0.2s;
        }

        #query:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            padding: 14px 26px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .examples {
            margin-top: 13px;
            color: #64748b;
            font-size: 13px;
        }

        .examples {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
        }

        .examples-label {
            color: #64748b;
            font-size: 13px;
            margin-right: 2px;
        }

        .example-chip {
            width: auto;
            padding: 6px 10px;
            margin: 0;
            background: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.18s;
        }

        .example-chip:hover {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
            transform: none;
        }

        .search-note {
            display: flex;
            gap: 7px;
            align-items: center;
            margin-top: 14px;
            color: #64748b;
            font-size: 12px;
        }

        .search-note span {
            color: #2563eb;
            font-weight: 700;
        }

        /* ---------- STATUS ---------- */

        .results-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 24px 2px 15px;
        }

        #status {
            margin: 0;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
        }

        .result-limit {
            color: #94a3b8;
            font-size: 12px;
            white-space: nowrap;
        }

        .loading-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 5px;
            border-radius: 50%;
            background: #2563eb;
            animation: pulse 1s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.35; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* ---------- RESULTS ---------- */

        .result {
            background: white;
            margin-bottom: 16px;
            padding: 22px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
            transition: 0.2s;
        }

        .result:hover {
            border-color: #bfdbfe;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .result-number {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 5px;
        }

        .speaker-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 7px;
        }

        .speaker {
            font-weight: 700;
            font-size: 17px;
            color: #1e293b;
        }

        .speaker-badge {
            padding: 4px 9px;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .location {
            color: #64748b;
            font-size: 13px;
        }

        .score {
            flex-shrink: 0;
            background: #ecfdf5;
            color: #047857;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        /* ---------- MATCHED TERMS ---------- */

        .matched {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }

        .matched-label {
            color: #64748b;
            font-size: 12px;
            padding: 5px 0;
        }

        .keyword {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ---------- TEXT ---------- */

        .text {
            line-height: 1.7;
            font-size: 15px;
            color: #334155;
            white-space: pre-wrap;
        }

        .utterance {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #eef2f7;
            color: #94a3b8;
            font-size: 12px;
        }

        /* ---------- EMPTY / ERROR ---------- */

        .empty {
            text-align: center;
            padding: 50px 20px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        /* ---------- FOOTER ---------- */

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #94a3b8;
            font-size: 12px;
        }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 600px) {

            header {
                padding: 32px 15px;
            }

            header h1 {
                font-size: 30px;
            }

            .container {
                margin: 22px auto;
                padding: 0 14px;
            }

            .search-section {
                padding: 18px;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .result {
                padding: 17px;
            }

            .results-heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 3px;
            }

            .search-note {
                align-items: flex-start;
            }

            .result-header {
                flex-direction: column;
            }

            .score {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <div class="logo-icon">⌕</div>
        <h1>DepoIndex</h1>
    </div>

    <p>Search and explore deposition transcripts</p>

</header>


<div class="container">

    <section class="search-section">

        <h2 class="search-title">
            Search deposition
        </h2>

        <p class="search-subtitle">
            Find relevant statements by keyword and inspect their source location.
        </p>

        <div class="search-box">

            <input
                id="query"
                type="text"
                placeholder="Try: loan payment, contract, student..."
                autocomplete="off"
            >

            <button id="searchButton" onclick="searchDeposition()">
                Search
            </button>

        </div>

        <div class="examples">
            <span class="examples-label">Try searching:</span>
            <button type="button" class="example-chip" data-query="loan">loan</button>
            <button type="button" class="example-chip" data-query="payment">payment</button>
            <button type="button" class="example-chip" data-query="contract">contract</button>
            <button type="button" class="example-chip" data-query="student loan">student loan</button>
        </div>

        <div class="search-note">
            <span>↳</span>
            Results are ranked by relevance. DepoIndex shows the top 5 matching passages.
        </div>

    </section>


    <div id="status"></div>

    <div id="results"></div>

</div>


<footer>
    DepoIndex · Deposition Transcript Search
</footer>


<script>

async function searchDeposition() {

    const queryInput = document.getElementById("query");
    const resultsDiv = document.getElementById("results");
    const statusDiv = document.getElementById("status");
    const searchButton = document.getElementById("searchButton");

    const query = queryInput.value.trim();

    if (!query) {

        statusDiv.textContent = "Please enter a search query.";
        resultsDiv.innerHTML = "";

        return;
    }

    statusDiv.innerHTML = `<span class="loading-dot"></span> Searching deposition...`;
    resultsDiv.innerHTML = "";
    searchButton.disabled = true;
    searchButton.textContent = "Searching...";


    try {

        const response = await fetch(
            `/search?q=${encodeURIComponent(query)}&limit=5`
        );

        const data = await response.json();


        if (!response.ok) {

            statusDiv.textContent =
                data.error || "Search failed.";

            return;
        }


        statusDiv.textContent =
            `Showing top ${data.count} relevant passage${data.count === 1 ? "" : "s"} for "${data.query}"`;


        if (data.results.length === 0) {

            resultsDiv.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">🔎</div>

                    <strong>No matching passages found</strong>

                    <p>
                        Try another keyword, a shorter phrase, or a broader search.
                    </p>

                </div>
            `;

            return;
        }


        data.results.forEach((result, index) => {

            const start = result.start;
            const end = result.end;

            const card = document.createElement("div");

            card.className = "result";


            const matchedTerms = result.matched_terms || [];

            const keywordHTML = matchedTerms
                .map(term =>
                    `<span class="keyword">${escapeHTML(term)}</span>`
                )
                .join("");


            card.innerHTML = `

                <div class="result-header">

                    <div>
                        <div class="result-number">Result ${index + 1}</div>

                        <div class="speaker-row">

                            <div class="speaker">
                                ${escapeHTML(result.speaker)}
                            </div>

                            <div class="speaker-badge">
                                SPEAKER
                            </div>

                        </div>

                        <div class="location">
                            📄 Page ${start.page}, Line ${start.line}
                            &nbsp;→&nbsp;
                            Page ${end.page}, Line ${end.line}
                        </div>

                    </div>

                    <div class="score">
                        Score ${result.score}
                    </div>

                </div>


                ${
                    matchedTerms.length > 0
                    ? `
                        <div class="matched">

                            <span class="matched-label">
                                Matched:
                            </span>

                            ${keywordHTML}

                        </div>
                    `
                    : ""
                }


                <div class="text">
                    ${escapeHTML(result.text)}
                </div>


                <div class="utterance">
                    Utterance ID: ${escapeHTML(result.utterance_id)}
                </div>

            `;

            resultsDiv.appendChild(card);

        });

    }


    catch (error) {

        statusDiv.textContent =
            "Could not connect to the server.";

        console.error(error);

    }


    finally {

        searchButton.disabled = false;
        searchButton.textContent = "Search";

    }

}


/* ---------- SECURITY ---------- */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ---------- ENTER KEY ---------- */

document.getElementById("query").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            searchDeposition();
        }

    }
);

</script>

</body>
</html>
